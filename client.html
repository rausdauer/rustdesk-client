<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RustDesk client</title><link rel="stylesheet" href="/src/style.css"></head><body class="clientBody"><form id="connectForm" class="connectBar"><label>Device ID<input id="peerId" required placeholder="123 456 789" autocomplete="off"></label><label>Device password<input id="password" type="password" placeholder="Or accept on remote device" autocomplete="off"></label><button id="connect" class="primary" disabled>Connect →</button><button id="disconnect" type="button" disabled>Disconnect</button></form><div class="tools"><span id="clientStatus" role="status">Loading connection engine…</span><select id="display" aria-label="Remote monitor" disabled><option value="0">Monitor 1</option></select><button id="cad" disabled>Ctrl+Alt+Del</button><button id="fullscreen">Fullscreen</button></div><div id="viewport" class="viewport"><div id="empty"><span class="monitor">▣</span><h2>Your next connection starts here.</h2><p>Apply your server settings, then enter a device ID.</p></div><canvas id="screen" tabindex="0" aria-label="Remote desktop. Click to send mouse and keyboard input; Escape releases keyboard capture." hidden></canvas></div><div class="clientFoot"><span>Click the desktop to control it. Escape releases keyboard capture.</span><span id="resolution">No active session</span></div><dialog id="auth"><form method="dialog" id="authForm"><h2 id="authTitle">Device password</h2><label for="credential">Credential</label><input id="credential" type="password" autocomplete="off" required><div class="dialogActions"><button type="button" id="authCancel">Cancel</button><button class="primary">Continue</button></div></form></dialog><script type="module" src="/src/client.ts"></script></body></html>
